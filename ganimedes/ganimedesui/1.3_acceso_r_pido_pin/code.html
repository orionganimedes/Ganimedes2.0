<script>
  (function() {

    const maxDigits = 4;
    const pinDots = document.querySelectorAll('.pin-dot');
    const keypadButtons = document.querySelectorAll('.keypad-num');
    const backspaceBtn = document.getElementById('backspaceBtn');
    const bioBtn = document.getElementById('bioBtn');
    const barberButtons = document.querySelectorAll('.barber-select-btn');
    const nameEl = document.getElementById('activeBarberName');
    const roleEl = document.getElementById('activeBarberRole');
    const switchUserBtn = document.getElementById('switchUserBtn');

    function updateDots() {
      pinDots.forEach((dot, index) => {
        if (index < pinCount) {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-secondary shadow-[0_0_12px_rgba(76,214,251,0.85)] scale-110 transition-all duration-200';
        } else {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-200';
        }
      });

      if (pinCount === maxDigits) {
        setTimeout(() => {
          pinDots.forEach(dot => {
            dot.className = 'pin-dot w-4 h-4 rounded-full bg-primary-fixed shadow-[0_0_14px_rgba(183,196,255,0.9)] scale-125 transition-all duration-200';

            pinCount = 0;
            updateDots();
          }, 600);
        }, 150);
      }
    }

    keypadButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (pinCount < maxDigits) {
          pinCount++;
          updateDots();
        }
      });
    });

    backspaceBtn.addEventListener('click', () => {
      if (pinCount > 0) {
        pinCount--;
        updateDots();
      }
    });

    bioBtn.addEventListener('click', () => {
      pinCount = maxDigits;
      updateDots();
    });

    barberButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        barberButtons.forEach(b => {
          b.classList.remove('bg-surface-container-high', 'opacity-100');
          b.classList.add('bg-surface-container', 'opacity-70');
          const checkIcon = b.querySelector('.bg-secondary');
          if (checkIcon) {
            checkIcon.classList.remove('h-4', 'w-4', 'text-surface-container-lowest');
            checkIcon.classList.add('w-3', 'h-3');
            checkIcon.innerHTML = '';
          }
        });

        btn.classList.add('bg-surface-container-high', 'opacity-100');
        btn.classList.remove('opacity-70');

        const newName = btn.dataset.name;
        const newRole = btn.dataset.role;
        if (nameEl) nameEl.textContent = newName;
        if (roleEl) roleEl.textContent = newRole;

        const firstName = newName.split(' ')[0];
        if (switchUserBtn) {
          switchUserBtn.querySelector('span:last-child').textContent = `¿No eres ${firstName}? Cambiar usuario`;
        }

        pinCount = 0;
        updateDots();
      });
    });

    switchUserBtn.addEventListener('click', () => {
      const carousel = document.getElementById('barberCarousel');
      if (carousel) {
        carousel.scrollBy({ left: 120, behavior: 'smooth' });
      }
    });
  })();
</script></main></body></html>
