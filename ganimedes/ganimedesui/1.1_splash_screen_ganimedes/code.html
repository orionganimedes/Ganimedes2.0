<script>
  (() => {
    const progressBar = document.getElementById('splash-progress');
    const statusText = document.getElementById('splash-status-text');
    const percentText = document.getElementById('splash-percent');
    
    if (!progressBar || !statusText || !percentText) return;

    const stages = [
      { p: 24, text: 'Verificando sesión activa y sucursal...' },
      { p: 48, text: 'Sincronizando catálogo con PocketBase...' },
      { p: 76, text: 'Cargando inventario y listas de precios...' },
      { p: 92, text: 'Preparando interfaz de alta velocidad...' },
      { p: 100, text: 'Listo para operar.' }
    ];

    let currentStage = 0;

    const interval = setInterval(() => {
      currentStage++;
      if (currentStage >= stages.length) {
        clearInterval(interval);
        return;
      }
      const stage = stages[currentStage];
      progressBar.style.width = stage.p + '%';
      percentText.innerText = stage.p + '%';
      statusText.innerText = stage.text;
    }, 700);
  })();
